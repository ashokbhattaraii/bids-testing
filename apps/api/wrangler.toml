name = "bids-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# ── D1 Database ───────────────────────────────────────────────────────────────
# Runtime binding is owned by the API Worker.
# Migration SQL source of truth is in ../../packages/db/migrations.
[[d1_databases]]
binding = "DB"
database_name = "bids"
database_id = "7dc18c2d-7e95-4bd2-9d64-1f32292c1503"
migrations_dir = "../../packages/db/migrations"

# ── Secrets (set via `wrangler secret put`) ───────────────────────────────────
#   JWT_PRIVATE_KEY  — RSA private key as JSON-stringified JWK (signs tokens)
#   JWT_PUBLIC_KEY   — RSA public key as JSON-stringified JWK  (verifies tokens in-memory)
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GOOGLE_REDIRECT_URI, FRONTEND_URL
#
# Generate a keypair once with:  node scripts/generate-keys.mjs
#
# Local dev: add to .dev.vars (never commit that file):
#   JWT_PRIVATE_KEY='{"kty":"RSA","n":"...","d":"..."}'
#   JWT_PUBLIC_KEY='{"kty":"RSA","n":"...","e":"AQAB"}'
